name: Build and Publish FHIR IG

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl -L https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar \
            -o input-cache/publisher.jar

      - name: Run SUSHI
        run: sushi .

      - name: Run IG Publisher
        run: java -jar input-cache/publisher.jar ig.ini -no-sushi

      - name: Extract tag version
        id: tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Deploy to versioned directory
        run: |
          VERSION=${{ steps.tag.outputs.version }}

          # Copy to versioned subdirectory (FHIR IG convention)
          rm -rf gh-pages/${VERSION}
          cp -r output gh-pages/${VERSION}

          # Update root with latest build, preserving versioned subdirs and .git
          cd gh-pages
          # Remove root-level files (not directories matching version patterns)
          find . -maxdepth 1 -type f -not -name '.git' -delete
          # Copy new output to root
          cp -r ../${VERSION}/* .
          cd ..

          # Create/update package-list.json (FHIR IG convention)
          cat > gh-pages/package-list.json << PLIST
          {
            "package-id": "example.fhir.ph.ereferral",
            "title": "PH eReferral Implementation Guide",
            "canonical": "https://jgsuess.github.io/ph-ereferral",
            "introduction": "Philippine eReferral FHIR Implementation Guide",
            "list": [
              {
                "version": "${VERSION}",
                "date": "$(date +%Y-%m-%d)",
                "path": "https://jgsuess.github.io/ph-ereferral/${VERSION}",
                "status": "draft",
                "fhirversion": "4.0.1",
                "sequence": "Draft",
                "current": true
              }
            ]
          }
          PLIST

      - name: Push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish IG ${{ steps.tag.outputs.tag }}" || echo "No changes"
          git push
